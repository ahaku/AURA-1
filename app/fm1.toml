# AURA-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "AURA-1"                 # the build's files: aura-1.fwsc, aura-1-X.Y.fwsc
id_prefix = "FM-1_7"           # package identity: dev FM-1_700, releases FM-1_7XXYYZZ
usb_manufacturer = "AURA-1"
usb_product = "AURA-1 FM-1"
ble = false                    # AURA-1 never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
ram_layout = "packed"         # share SRAM between the platform and the audio buffers
# the site
tagline = "An enhanced generative ambient synthesizer for the FM-1 (built on fm1-amb)"
repo = "https://github.com/ahaku/AURA-1"
licence = "MPL-2.0"
credits = "AURA-1 is built on top of fm1-amb by Charles Vestal, fm1-base and felucca-bsp (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "ahaku; based on AMB-1 by Charles Vestal"
description = "AURA-1 extends fm1-amb by Charles Vestal with sixteen ambient pieces, a live polyphonic Solo synthesizer with arpeggiator and Glide, procedural textures, singing bowls and cosmic visualizations."
tags = ["ambient", "generative", "fm", "synth"]
install = "https://ahaku.github.io/AURA-1/install/"
site = "https://ahaku.github.io/AURA-1/"
screenshot = "docs/img/screen-garden.png"
