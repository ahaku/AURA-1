name: Build, test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      FM1_REPO: ${{ github.server_url }}/${{ github.repository }}
      FM1_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0
          python -m pip install -r requirements-ci.txt
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
          npm ci --prefix tests/browser
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/fm1
          key: fm1-linux-toolchains-emsdk-6.0.10-sdk-d179b448-v1
      - name: Build firmware, run tests and assemble the site
        run: |
          source tools/setup_ci.sh
          sh build.sh
          sh tests/run_tests.sh
          sh build.sh --rfm1
          python tools/make_pages.py app/build/aura-1.fwsc dev
          python tools/check_site.py app/build/pages
          mkdir -p app/build/artifacts
          cp app/build/aura-1.fwsc app/build/aura-1.bin app/build/firmware.json app/build/artifacts/
          cp app/build/rfm1/aura_1-dev+*.rfm1 app/build/artifacts/aura-1.rfm1
          (cd app/build/artifacts && sha256sum aura-1.fwsc aura-1.bin aura-1.rfm1 firmware.json > SHA256SUMS)
      - name: Browser regression checks
        run: |
          python tools/serve_site.py --port 8080 > app/build/site-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          cd tests/browser
          node ../host/studio_test.mjs http://127.0.0.1:8080/
      - name: Upload development firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-1-development-firmware
          path: app/build/artifacts/
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: |
            app/build/tests/*.log
            app/build/site-server.log
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: app/build/pages

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
